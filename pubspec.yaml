name: marcas
description: "CineAcervo - catálogo de filmes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0-113.2.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.0.0
  toast: ^0.3.0
  share_plus: ^11.0.0
  page_view_dot_indicator: ^2.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - recursos/jsons/filmes.json
    - recursos/jsons/comentarios.json
    - recursos/imagens/
